<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6ff;color:#17172b}
header{background:linear-gradient(135deg,#5b21b6,#2563eb);color:#fff;padding:26px 16px}
header h1{margin:0;font-size:32px}header p{margin:7px 0 0;opacity:.9}
main{max-width:1050px;margin:22px auto;padding:0 14px}
.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 6px 20px #0001}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}
.game{border:2px solid #e5e7eb;border-radius:14px;padding:13px;background:#fff;cursor:pointer;transition:.15s}
.game:hover,.game.active{border-color:#6d28d9;background:#f3e8ff}
.game img{width:58px;height:58px;object-fit:cover;border-radius:13px;display:block;margin-bottom:8px}
#topup{display:none}.back{background:#eef2ff;color:#3730a3;margin-bottom:14px}
label{display:block;font-weight:bold;margin:13px 0 7px}
input,select{width:100%;padding:13px;border:1px solid #cfd4df;border-radius:10px;font-size:16px}
.nominals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.nominal{border:2px solid #e5e7eb;border-radius:12px;padding:13px;background:#fff;cursor:pointer}
.nominal.active{border-color:#2563eb;background:#eff6ff}
.price{font-weight:bold;color:#2563eb;margin-top:5px}
.summary{background:#f8fafc;border-radius:12px;padding:15px;line-height:1.8}
button{border:0;border-radius:12px;padding:13px 18px;font-size:16px;font-weight:bold;cursor:pointer}
.primary{background:#2563eb;color:#fff;width:100%;margin-top:14px}
.small{font-size:13px;color:#667085}
footer{text-align:center;padding:28px;color:#667085}
</style>
</head>
<body>
<header><h1>Next Game</h1><p>Top Up Game Cepat & Aman</p></header>

<main>
<section id="gameSection" class="card">
<h2>🎮 Pilih Game</h2>
<div id="games" class="games"></div>
</section>

<section id="topup" class="card">
<button class="back" onclick="showGames()">← Kembali ke daftar game</button>
<h2 id="gameTitle"></h2>
<label>ID Player</label>
<input id="playerId" placeholder="Masukkan ID Player" inputmode="numeric">
<p class="small">Pastikan ID pemain benar sebelum melanjutkan.</p>

<h3>Nominal Top Up</h3>
<div id="nominals" class="nominals"></div>

<label>Metode pembayaran</label>
<select id="payment">
<option value="">Pilih pembayaran</option>
<option>QRIS</option><option>DANA</option><option>OVO</option>
<option>GoPay</option><option>Transfer Bank</option>
</select>

<h3>Ringkasan</h3>
<div id="summary" class="summary">Pilih nominal.</div>
<button class="primary" onclick="checkout()">Lanjut ke Checkout</button>
</section>
</main>

<footer>Next Game © 2026<br>CS: 0882008627347</footer>

let selectedGame="";
let selectedItem=null;

const money=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);

function renderGames(){
 const el=document.getElementById("games");el.innerHTML="";
 Object.keys(data).forEach(game=>{
   const b=document.createElement("div");b.className="game";
   b.innerHTML=<img src="${logos[game]||''}" onerror="this.style.display='none'><b>${game}</b>;
   b.onclick=()=>openGame(game);el.appendChild(b);
 });
}

function openGame(game){
 selectedGame=game;selectedItem=null;
 document.getElementById("gameSection").style.display="none";
 document.getElementById("topup").style.display="block";
 document.getElementById("gameTitle").textContent="Top Up "+game;
 renderNominals();updateSummary();
 window.scrollTo({top:0,behavior:"smooth"});
}

function showGames(){
 document.getElementById("topup").style.display="none";
 document.getElementById("gameSection").style.display="block";
 window.scrollTo({top:0,behavior:"smooth"});
}

function renderNominals(){
 const el=document.getElementById("nominals");el.innerHTML="";
 data[selectedGame].items.forEach(([nominal,price],i)=>{
   const b=document.createElement("div");
   b.className="nominal"+(selectedItem&&selectedItem.i===i?" active":"");
   b.innerHTML=<div>${nominal}</div><div class="price">${money(price)}</div>;
   b.onclick=()=>{selectedItem={i,nominal,price};renderNominals();updateSummary()};
   el.appendChild(b);
 });
}

function updateSummary(){
 const id=document.getElementById("playerId").value.trim();
 const pay=document.getElementById("payment").value;
 document.getElementById("summary").innerHTML=selectedItem
 ? <b>Game:</b> ${selectedGame}<br><b>ID Player:</b> ${id||"-"}<br><b>Nominal:</b> ${selectedItem.nominal}<br><b>Total:</b> ${money(selectedItem.price)}<br><b>Pembayaran:</b> ${pay||"-"}
 : "Pilih nominal.";
}
document.getElementById("playerId").addEventListener("input",updateSummary);
document.getElementById("payment").addEventListener("change",updateSummary);

function checkout(){
 const id=document.getElementById("playerId").value.trim();
 const pay=document.getElementById("payment").value;
 if(!id)return alert("Masukkan ID Player terlebih dahulu.");
 if(!selectedItem)return alert("Pilih nominal terlebih dahulu.");
 if(!pay)return alert("Pilih metode pembayaran.");
 alert("Data checkout sudah siap. Payment gateway dan API supplier akan disambungkan pada tahap berikutnya.");
}

renderGames();
