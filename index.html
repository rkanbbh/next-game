<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Next Game - Top Up Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Next Game</h1>
  <p>Top Up Game Cepat & Aman</p>
</header>

<main>
<section id="gameSection" class="card">
  <h2>🎮 Pilih Game</h2>
  <div id="games" class="games"></div>
</section>

<section id="topup" class="card" hidden>
  <button class="back" onclick="showGames()">← Kembali</button>
  <h2 id="gameTitle"></h2>

  <label>ID Player</label>
  <input id="playerId" type="text" placeholder="Masukkan ID Player" autocomplete="off">

  <h3>Nominal Top Up</h3>
  <div id="nominals" class="nominals"></div>

  <label>Metode Pembayaran</label>
  <select id="payment">
    <option value="">Pilih pembayaran</option>
    <option value="qris">QRIS</option>
    <option value="gopay">GoPay</option>
    <option value="bank_transfer">Transfer Bank / Virtual Account</option>
    <option value="shopeepay">ShopeePay</option>
  </select>

  <h3>Ringkasan</h3>
  <div id="summary" class="summary">Pilih nominal terlebih dahulu.</div>

  <button id="payButton" class="primary" onclick="payNow()">Bayar Sekarang</button>
  <p id="status" class="status"></p>
</section>
</main>

<footer>Next Game © 2026<br>CS: 0882008627347</footer>

<script>
const data = {"Free Fire": [["26160 Diamonds", 7431018], ["28170 Diamonds", 6905365], ["24150 Diamonds", 6402109], ["5 Diamonds", 1440], ["5 Diamonds", 1431]], "Mobile Legends": [["5 Diamond", 1500], ["12 Diamond", 3000], ["19 Diamond", 4500], ["28 Diamond", 6500], ["36 Diamond", 8000], ["44 Diamond", 10000], ["59 Diamond", 13000], ["85 Diamond", 18000], ["100 Diamond", 21000], ["170 Diamond", 35000], ["240 Diamond", 49000], ["296 Diamond", 60000], ["408 Diamond", 82000], ["568 Diamond", 114000], ["875 Diamond", 175000], ["1200 Diamond", 238000], ["2010 Diamond", 398000], ["4830 Diamond", 950000]], "Magic Chess": [["4830 Diamonds", 1189422], ["2010 Diamonds", 516253], ["12 Diamonds", 3514], ["5 Diamonds", 1605]], "Honor of Kings": [["8000 + 360 Tokens", 1559619], ["4000 + 180 Tokens", 779733], ["2400 + 108 Tokens", 467780], ["1200 + 45 Tokens", 233815], ["800 + 30 Tokens", 155827], ["560 Tokens", 109034], ["400 Tokens", 77837], ["240 Tokens", 46643], ["80 Tokens", 15447], ["16 Tokens", 3112]], "PUBG Mobile": [["48000 + 16800 UC", 13220980], ["36000 + 12600 UC", 9915734], ["120 UC", 32684], ["60 UC", 16343]], "Valorant": [["16700 VP", 1624036], ["1000 VP", 106245], ["475 VP", 53123]], "Roblox": [["2000 Robux", 394830], ["400 Robux", 96195], ["250 Robux", 59920]], "Point Blank": [["60.000 PB Cash", 456354], ["36.000 PB Cash", 273813], ["24.000 PB Cash", 182541], ["2.400 PB Cash", 18254], ["1.200 PB Cash", 9127]], "Steam Voucher": [["IDR 600.000", 607477], ["IDR 400.000", 405395], ["IDR 250.000", 253490], ["IDR 8.000", 8136], ["IDR 6.000", 6054]], "Blood Strike": [["100 + 5 Golds", 13800], ["300 + 20 Golds", 41100], ["500 + 40 Golds", 68500], ["600 + 45 Gold", 82200], ["800 + 60 Gold", 109500], ["1000 + 100 Golds", 136800], ["1200 + 110 Gold", 164300], ["1500 + 140 Gold", 205200], ["2000 + 260 Golds", 273600], ["2500 + 300 Gold", 342000], ["3000 + 360 Gold", 410300], ["4000 + 520 Gold", 547100], ["5000 + 800 Golds", 683800], ["6000 + 900 Gold", 820600], ["7000 + 1060 Gold", 957400], ["8000 + 1160 Gold", 1094100], ["9000 + 1260 Gold", 1230900], ["10000 + 1600 Golds", 1367600], ["15000 + 2400 Gold", 2051400], ["20000 + 3200 Gold", 2735200], ["25000 + 4000 Gold", 3419000], ["50000 + 8000 Gold", 6838000]], "Call of Duty Mobile": [["7656 CP", 928459], ["3564 CP", 464230], ["128 CP", 18569], ["63 CP", 9285]], "Delta Force": [["19440 + 5832 Delta Coins", 4530325], ["12960 + 3888 Delta Coins", 3020217], ["30 + 2 Delta Coins", 8024], ["18 + 1 Delta Coins", 5349]]};
const icons = {
  "Free Fire":"🔥","Mobile Legends":"⚔️","Magic Chess":"♟️",
  "Honor of Kings":"👑","PUBG Mobile":"🔫","Valorant":"🎯",
  "Roblox":"🧱","Point Blank":"🎯","Steam Voucher":"🎮",
  "Blood Strike":"💥","Call of Duty Mobile":"🪖","Delta Force":"🚀"
};

let selectedGame = "";
let selectedItem = null;

const money = n => new Intl.NumberFormat("id-ID", {
  style:"currency", currency:"IDR", maximumFractionDigits:0
}).format(n);

function renderGames() {
  const box = document.getElementById("games");
  box.innerHTML = "";
  Object.keys(data).forEach(game => {
    const card = document.createElement("div");
    card.className = "game";
    card.innerHTML = `<div class="icon">${icons[game] || "🎮"}</div><b>${game}</b>`;
    card.onclick = () => openGame(game);
    box.appendChild(card);
  });
}

function openGame(game) {
  selectedGame = game;
  selectedItem = null;
  document.getElementById("gameSection").hidden = true;
  document.getElementById("topup").hidden = false;
  document.getElementById("gameTitle").textContent = "Top Up " + game;
  document.getElementById("status").textContent = "";
  renderNominals();
  updateSummary();
  scrollTo(0,0);
}

function showGames() {
  document.getElementById("topup").hidden = true;
  document.getElementById("gameSection").hidden = false;
  scrollTo(0,0);
}

function renderNominals() {
  const box = document.getElementById("nominals");
  box.innerHTML = "";
  data[selectedGame].forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "nominal" + (selectedItem && selectedItem.index === index ? " active" : "");
    card.innerHTML = `<b>${item[0]}</b><div class="price">${money(item[1])}</div>`;
    card.onclick = () => {
      selectedItem = {index, nominal:item[0], price:item[1]};
      renderNominals();
      updateSummary();
    };
    box.appendChild(card);
  });
}

function updateSummary() {
  const id = document.getElementById("playerId").value.trim();
  const pay = document.getElementById("payment").value;
  const summary = document.getElementById("summary");

  if (!selectedItem) {
    summary.textContent = "Pilih nominal terlebih dahulu.";
    return;
  }

  summary.innerHTML =
    `<b>Game:</b> ${selectedGame}<br>` +
    `<b>ID Player:</b> ${id || "-"}<br>` +
    `<b>Nominal:</b> ${selectedItem.nominal}<br>` +
    `<b>Total:</b> ${money(selectedItem.price)}<br>` +
    `<b>Pembayaran:</b> ${pay || "-"}`;
}

document.getElementById("playerId").addEventListener("input", updateSummary);
document.getElementById("payment").addEventListener("change", updateSummary);

async function payNow() {
  const id = document.getElementById("playerId").value.trim();
  const payment = document.getElementById("payment").value;
  const status = document.getElementById("status");
  const btn = document.getElementById("payButton");

  if (!id) return alert("Masukkan ID Player terlebih dahulu.");
  if (!selectedItem) return alert("Pilih nominal terlebih dahulu.");
  if (!payment) return alert("Pilih metode pembayaran.");

  btn.disabled = true;
  status.textContent = "Membuat pembayaran...";

  try {
    const res = await fetch("/api/create-payment", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        game:selectedGame,
        playerId:id,
        nominal:selectedItem.nominal,
        price:selectedItem.price,
        payment
      })
    });

    const result = await res.json();
    if (!res.ok) throw new Error(result.error || "Gagal membuat pembayaran.");

    if (result.redirect_url) {
      window.location.href = result.redirect_url;
      return;
    }

    throw new Error("URL pembayaran tidak diterima.");
  } catch (err) {
    status.textContent = err.message;
    btn.disabled = false;
  }
}

renderGames();
</script>
</body>
</html>
